name: flight-delay-backend

x-worker: &worker
  restart: unless-stopped
  init: true
  expose:
    - "8000"
  networks:
    - backend

services:
  data-simulator:
    build: ../data-simulator
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SIMULATOR_PORT:-8000}:8000"
    environment:
      CSV_PATH: /app/data/T_ONTIME_REPORTING_1.csv
      WINDOW_SIZE: "${SIMULATOR_WINDOW_SIZE:-100}"
      SLIDE_STEP: "${SIMULATOR_SLIDE_STEP:-20}"
    volumes:
      - ../data-simulator/data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 15s
      timeout: 5s
      start_period: 35s
      retries: 5
    networks:
      - backend

  gateway:
    build: ./gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      analytics:
        condition: service_healthy
      clustering:
        condition: service_healthy
      prediction:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    networks:
      - backend

  analytics:
    <<: *worker
    build: ./analytics
    depends_on:
      ingestion:
        condition: service_healthy
    env_file:
      - path: ./analytics/.env
        required: false
    environment:
      SERVICE_NAME: analytics
      ROOT_PATH: /api/analytics
      SCHEDULER_ENABLED: "${ANALYTICS_SCHEDULER_ENABLED:-true}"
      JOB_INTERVAL_SECONDS: "${ANALYTICS_INTERVAL_SECONDS:-300}"
      PGHOST: ingestion
      PGDATABASE: "${ANALYTICS_POSTGRES_DB:-analytics_db}"
      PGUSER: "${ANALYTICS_POSTGRES_USER:-analytics}"
      PGPASSWORD: "${ANALYTICS_POSTGRES_PASSWORD:-analytics}"

  clustering:
    <<: *worker
    build: ./clustering
    environment:
      SERVICE_NAME: clustering
      ROOT_PATH: /api/clustering
      SCHEDULER_ENABLED: "${CLUSTERING_SCHEDULER_ENABLED:-false}"
      JOB_INTERVAL_SECONDS: "${CLUSTERING_INTERVAL_SECONDS:-86400}"

  prediction:
    <<: *worker
    build: ./prediction
    environment:
      SERVICE_NAME: prediction
      ROOT_PATH: /api/prediction
      SCHEDULER_ENABLED: "${PREDICTION_SCHEDULER_ENABLED:-false}"
      JOB_INTERVAL_SECONDS: "${PREDICTION_INTERVAL_SECONDS:-300}"

  ingestion:
    <<: *worker
    build: ./ingestion
    stop_grace_period: 45s
    depends_on:
      data-simulator:
        condition: service_healthy
    volumes:
      - ../data-simulator/data:/data-source:ro
      - analytics_data:/var/lib/postgresql/data
    environment:
      SERVICE_NAME: ingestion
      ROOT_PATH: /api/ingestion
      SCHEDULER_ENABLED: "${INGESTION_SCHEDULER_ENABLED:-true}"
      JOB_INTERVAL_SECONDS: "${INGESTION_INTERVAL_SECONDS:-300}"
      SIMULATOR_BASE_URL: "${SIMULATOR_BASE_URL:-http://data-simulator:8000}"
      INGESTION_BATCH_SIZE: "${INGESTION_BATCH_SIZE:-5}"
      POSTGRES_USER: "${ANALYTICS_POSTGRES_USER:-analytics}"
      POSTGRES_PASSWORD: "${ANALYTICS_POSTGRES_PASSWORD:-analytics}"
      POSTGRES_DB: "${ANALYTICS_POSTGRES_DB:-analytics_db}"

volumes:
  analytics_data:

networks:
  backend:
    driver: bridge
