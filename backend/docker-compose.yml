name: flight-delay-backend

include:
  - ./database/docker-compose.yml

x-worker: &worker
  restart: unless-stopped
  init: true
  expose:
    - "8000"
  networks:
    - backend

x-postgres-client: &postgres-client
  DATABASE_URL: "postgresql://"
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: "${PROCESSED_POSTGRES_DB:-flight_processed_db}"
  PGUSER: "${ANALYTICS_POSTGRES_USER:-root}"
  PGPASSWORD: "${ANALYTICS_POSTGRES_PASSWORD:-123456}"

services:
  gateway:
    build: ./gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-2002}:8080"
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      analytics:
        condition: service_healthy
      clustering:
        condition: service_healthy
      prediction:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    networks:
      - backend

  frontend:
    build:
      context: ../fe
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:${GATEWAY_PORT:-2002}/api"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - backend

  analytics:
    <<: *worker
    build: ./analytics
    ports:
      - "127.0.0.1:${ANALYTICS_PORT:-2005}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    env_file:
      - path: ./analytics/.env
        required: false
    environment:
      <<: *postgres-client
      SERVICE_NAME: analytics
      ROOT_PATH: /api/analytics
      SCHEDULER_ENABLED: "${ANALYTICS_SCHEDULER_ENABLED:-true}"
      JOB_INTERVAL_SECONDS: "${ANALYTICS_INTERVAL_SECONDS:-300}"

  clustering:
    <<: *worker
    build: ./clustering
    ports:
      - "127.0.0.1:${CLUSTERING_PORT:-2006}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    volumes:
      - clustering_models:/service/models
    environment:
      <<: *postgres-client
      SERVICE_NAME: clustering
      ROOT_PATH: /api/clustering
      SCHEDULER_ENABLED: "${CLUSTERING_SCHEDULER_ENABLED:-true}"
      RUN_ON_STARTUP: "${CLUSTERING_RUN_ON_STARTUP:-true}"
      JOB_INTERVAL_SECONDS: "${CLUSTERING_INTERVAL_SECONDS:-86400}"
      LIVE_API_MODE: "true"
      MODEL_PATH: /service/models/clustering_bundle.joblib

  prediction:
    <<: *worker
    build: ./prediction
    ports:
      - "127.0.0.1:${PREDICTION_PORT:-2007}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    volumes:
      - prediction_models:/service/models
    environment:
      <<: *postgres-client
      SERVICE_NAME: prediction
      ROOT_PATH: /api/prediction
      SCHEDULER_ENABLED: "${PREDICTION_SCHEDULER_ENABLED:-true}"
      RUN_ON_STARTUP: "${PREDICTION_RUN_ON_STARTUP:-true}"
      JOB_INTERVAL_SECONDS: "${PREDICTION_INTERVAL_SECONDS:-300}"
      LIVE_API_MODE: "true"
      MODEL_PATH: /service/models/prediction_bundle.joblib

  ingestion:
    <<: *worker
    build: ./ingestion
    ports:
      - "127.0.0.1:${INGESTION_PORT:-2004}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *postgres-client
      RAW_DATABASE_URL: "postgresql:///?dbname=${RAW_POSTGRES_DB:-flight_raw_db}"
      SERVICE_NAME: ingestion
      ROOT_PATH: /api/ingestion
      SCHEDULER_ENABLED: "${INGESTION_SCHEDULER_ENABLED:-true}"
      RUN_ON_STARTUP: "${INGESTION_RUN_ON_STARTUP:-true}"
      JOB_INTERVAL_SECONDS: "${INGESTION_INTERVAL_SECONDS:-300}"
      AIRLABS_API_KEY: "${AIRLABS_API_KEY:-}"
      AIRLABS_ACCOUNTS: '${AIRLABS_ACCOUNTS:-}'
      AIRLABS_AIRPORTS: "${AIRLABS_AIRPORTS:-JFK}"
      AIRLABS_MAX_PAGES: "${AIRLABS_MAX_PAGES:-1}"
      AIRLABS_MONTHLY_BUDGET: "${AIRLABS_MONTHLY_BUDGET:-800}"
      AIRLABS_RESET_DAY: "${AIRLABS_RESET_DAY:-1}"
      OPENWEATHER_API_KEY: "${OPENWEATHER_API_KEY:-}"
      OPENWEATHER_MONTHLY_BUDGET: "${OPENWEATHER_MONTHLY_BUDGET:-10000}"
      OPENWEATHER_RESET_DAY: "${OPENWEATHER_RESET_DAY:-1}"
      WEATHER_CACHE_SECONDS: "${WEATHER_CACHE_SECONDS:-900}"
      LIVE_API_MODE: "true"
      TRIGGER_DOWNSTREAM_URLS: "${TRIGGER_DOWNSTREAM_URLS:-}"

volumes:
  clustering_models:
  prediction_models:
