name: flight-delay-backend

include:
  - ./database/docker-compose.yml

x-worker: &worker
  restart: unless-stopped
  init: true
  expose:
    - "8000"
  networks:
    - backend

x-postgres-client: &postgres-client
  DATABASE_URL: "postgresql://"
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: "${ANALYTICS_POSTGRES_DB:-analytics_db}"
  PGUSER: "${ANALYTICS_POSTGRES_USER:-analytics}"
  PGPASSWORD: "${ANALYTICS_POSTGRES_PASSWORD:-analytics}"

services:
  data-simulator:
    build: ../data-simulator
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SIMULATOR_PORT:-2003}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *postgres-client
      CSV_PATH: /app/data/T_ONTIME_REPORTING_1.csv
      WINDOW_SIZE: "${SIMULATOR_WINDOW_SIZE:-100}"
      SLIDE_STEP: "${SIMULATOR_SLIDE_STEP:-20}"
      CHUNK_SIZE: "${SIMULATOR_CHUNK_SIZE:-5000}"
      QUEUE_MAXSIZE: "${SIMULATOR_QUEUE_MAXSIZE:-4}"
      MAX_SEED_ROWS: "${SIMULATOR_MAX_SEED_ROWS:-0}"
    volumes:
      - ../data-simulator/data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 15s
      timeout: 5s
      start_period: 35s
      retries: 5
    networks:
      - backend

  gateway:
    build: ./gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-2002}:8080"
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      analytics:
        condition: service_healthy
      clustering:
        condition: service_healthy
      prediction:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    networks:
      - backend

  frontend:
    build:
      context: ../fe
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:${GATEWAY_PORT:-2002}/api"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - backend

  analytics:
    <<: *worker
    build: ./analytics
    ports:
      - "127.0.0.1:${ANALYTICS_PORT:-2005}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./analytics/.env
        required: false
    environment:
      <<: *postgres-client
      SERVICE_NAME: analytics
      ROOT_PATH: /api/analytics
      SCHEDULER_ENABLED: "${ANALYTICS_SCHEDULER_ENABLED:-true}"
      JOB_INTERVAL_SECONDS: "${ANALYTICS_INTERVAL_SECONDS:-300}"

  clustering:
    <<: *worker
    build: ./clustering
    ports:
      - "127.0.0.1:${CLUSTERING_PORT:-2006}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    volumes:
      - clustering_models:/service/models
      - ../data-simulator/data:/data-source:ro
    environment:
      <<: *postgres-client
      SERVICE_NAME: clustering
      ROOT_PATH: /api/clustering
      SCHEDULER_ENABLED: "${CLUSTERING_SCHEDULER_ENABLED:-true}"
      RUN_ON_STARTUP: "${CLUSTERING_RUN_ON_STARTUP:-true}"
      JOB_INTERVAL_SECONDS: "${CLUSTERING_INTERVAL_SECONDS:-86400}"
      FALLBACK_CSV_PATH: /data-source/T_ONTIME_REPORTING_1.csv
      MODEL_PATH: /service/models/clustering_bundle.joblib

  prediction:
    <<: *worker
    build: ./prediction
    ports:
      - "127.0.0.1:${PREDICTION_PORT:-2007}:8000"
    environment:
      SERVICE_NAME: prediction
      ROOT_PATH: /api/prediction
      SCHEDULER_ENABLED: "${PREDICTION_SCHEDULER_ENABLED:-false}"
      JOB_INTERVAL_SECONDS: "${PREDICTION_INTERVAL_SECONDS:-300}"

  ingestion:
    <<: *worker
    build: ./ingestion
    ports:
      - "127.0.0.1:${INGESTION_PORT:-2004}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      data-simulator:
        condition: service_healthy
    volumes:
      - ../data-simulator/data:/data-source:ro
    environment:
      <<: *postgres-client
      SERVICE_NAME: ingestion
      ROOT_PATH: /api/ingestion
      SCHEDULER_ENABLED: "${INGESTION_SCHEDULER_ENABLED:-true}"
      RUN_ON_STARTUP: "${INGESTION_RUN_ON_STARTUP:-true}"
      JOB_INTERVAL_SECONDS: "${INGESTION_INTERVAL_SECONDS:-300}"
      SIMULATOR_BASE_URL: "${SIMULATOR_BASE_URL:-http://data-simulator:8000}"
      INGESTION_BATCH_SIZE: "${INGESTION_BATCH_SIZE:-5}"
      FALLBACK_CSV_PATH: /data-source/T_ONTIME_REPORTING_1.csv
      TRIGGER_DOWNSTREAM_URLS: "${TRIGGER_DOWNSTREAM_URLS-http://clustering:8000/run}"

volumes:
  clustering_models:
