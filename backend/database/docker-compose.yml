name: flight-delay-backend

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-2001}:5432"
    environment:
      POSTGRES_USER: "root"
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: "${PROCESSED_POSTGRES_DB:-flight_processed_db}"
      RAW_POSTGRES_DB: "${RAW_POSTGRES_DB:-flight_raw_db}"
    volumes:
      - analytics_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/00-databases.sh:ro
      - ../ingestion/db/schema.sql:/opt/plant-db/processed-schema.sql:ro
      - ../ingestion/db/model_flights.sql:/opt/plant-db/model-flights.sql:ro
      - ../db/init.sql:/opt/plant-db/processed-legacy.sql:ro
      - ../ingestion/db/raw_schema.sql:/opt/plant-db/raw-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 10
    networks:
      - backend

volumes:
  analytics_data:

networks:
  backend:
    driver: bridge
